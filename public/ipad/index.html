<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NEFA Software - iPad Workspace</title>
  <style>
    * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; background: #020617; color: #f1f5f9; }
    
    button, input, select { font: inherit; outline: none; }
    .hidden { display: none !important; }

    .error-banner { position: fixed; top: 0; left: 0; right: 0; background: #dc2626; color: #fff; padding: 8px 14px; font-size: 11px; font-weight: bold; z-index: 9999; display: flex; justify-content: space-between; align-items: center; }

    .login-screen { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; background: #020617; }
    .login-card { width: 100%; max-width: 380px; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); text-align: center; }
    .logo-box { width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #2563eb, #06b6d4); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 12px; }
    .login-card h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .login-card p { font-size: 11px; color: #94a3b8; margin-bottom: 20px; }
    .login-card label { display: block; text-align: left; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    .login-card input { width: 100%; background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 13px; margin-bottom: 16px; }
    .btn-login { width: 100%; background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }

    .app-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .top-tabs { height: 48px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; }
    .tab-btn { background: transparent; border: 0; color: #94a3b8; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .view-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
    
    /* CHAT VIEW */
    .chat-layout { flex: 1; display: flex; position: relative; overflow: hidden; }
    .backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 30; }
    .sidebar { width: 260px; height: 100%; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0f172a; z-index: 40; position: absolute; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.2s ease; }
    .sidebar.open { transform: translateX(0); }
    .sb-header { padding: 12px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .sb-scroll { flex: 1; overflow-y: auto; padding: 8px; }
    .ch-item { padding: 8px 10px; border-radius: 8px; margin-bottom: 2px; cursor: pointer; font-size: 12px; font-weight: 600; color: #cbd5e1; }
    .ch-item.active { background: rgba(37,99,235,0.2); color: #60a5fa; }

    .chat-main { flex: 1; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .chat-top { height: 44px; padding: 0 12px; border-bottom: 1px solid #1e293b; background: #0f172a; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; font-size: 12px; font-weight: bold; }
    .msg-area { flex: 1; overflow-y: auto; padding: 12px; }
    .msg-row { margin-bottom: 10px; max-width: 85%; clear: both; float: left; }
    .msg-row.me { float: right; text-align: right; }
    .msg-bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; background: #0f172a; border: 1px solid #1e293b; color: #f1f5f9; font-size: 12px; text-align: left; }
    .msg-row.me .msg-bubble { background: #2563eb; border-color: #2563eb; color: #fff; }
    .input-bar { padding: 8px 12px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; align-items: center; flex-shrink: 0; }
    .text-input { flex: 1; height: 34px; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 0 10px; color: #fff; font-size: 12px; margin-right: 6px; }
    .btn-send { background: #2563eb; color: #fff; border: 0; height: 34px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; }

    /* CLIENTES Y COMEX VIEWS */
    .p-content { padding: 14px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card h2 { font-size: 13px; font-weight: bold; color: #60a5fa; margin-bottom: 8px; }
    .field-row { margin-bottom: 8px; }
    .field-row label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 3px; }
    .field-row input { width: 100%; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; color: #fff; font-size: 12px; }
    .btn-action { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
    
    .table-box { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
    .table-box th, .table-box td { border: 1px solid #1e293b; padding: 6px; text-align: left; }
    .table-box th { background: #1e293b; color: #94a3b8; }

    .icon-btn { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  </style>
</head>
<body>
  <div id="err-bar" class="error-banner hidden">
    <span id="err-txt"></span>
    <button onclick="document.getElementById('err-bar').className='error-banner hidden'" style="background:transparent;border:0;color:#fff;cursor:pointer">Cerrar</button>
  </div>

  <div id="login-view" class="login-screen">
    <div class="login-card">
      <div class="logo-box">⚡</div>
      <h1>NEFA iPad 2</h1>
      <p>Ingresa tu nombre para entrar</p>
      <form id="login-form">
        <label>Tu Nombre:</label>
        <input id="login-input" type="text" value="Franco Sierralta" required>
        <button type="submit" class="btn-login">Entrar →</button>
      </form>
    </div>
  </div>

  <div id="app-view" class="app-wrap hidden">
    <header class="top-tabs">
      <div style="font-weight:bold;font-size:12px;">⚡ NEFA iPad</div>
      <div>
        <button id="tab-chat" class="tab-btn active" onclick="switchTab('chat')">Chat</button>
        <button id="tab-clients" class="tab-btn" onclick="switchTab('clients')">Clientes</button>
        <button id="tab-comex" class="tab-btn" onclick="switchTab('comex')">CBM / Comex</button>
      </div>
    </header>

    <!-- VISTA CHAT -->
    <div id="view-chat" class="view-container chat-layout">
      <div id="sb-backdrop" class="backdrop hidden" onclick="toggleSidebar(false)"></div>
      <aside id="sidebar" class="sidebar">
        <div class="sb-header">
          <span style="font-size:12px;font-weight:bold;">Canales</span>
          <button class="icon-btn" onclick="toggleSidebar(false)">✕</button>
        </div>
        <div id="ch-list" class="sb-scroll"></div>
      </aside>

      <main class="chat-main">
        <header class="chat-top">
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="icon-btn" onclick="toggleSidebar(true)">☰</button>
            <span id="active-ch-title"># general</span>
          </div>
          <button class="icon-btn" onclick="sendPoke()">🔔</button>
        </header>
        <div id="msg-area" class="msg-area"></div>
        <div class="input-bar">
          <input id="msg-input" class="text-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
          <button class="btn-send" onclick="sendMsg()">Enviar</button>
        </div>
      </main>
    </div>

    <!-- VISTA CLIENTES -->
    <div id="view-clients" class="view-container p-content hidden">
      <div class="card">
        <h2>Gestión de Clientes & Firebase</h2>
        <div class="field-row"><label>Nombre:</label><input id="cli-name" type="text" placeholder="Juan Pérez"></div>
        <div class="field-row"><label>Teléfono / Contacto:</label><input id="cli-phone" type="text" placeholder="+54 9 351..."></div>
        <div class="field-row"><label>Debe ($):</label><input id="cli-debt" type="number" placeholder="0"></div>
        <button class="btn-action" onclick="createClient()">Guardar Cliente</button>
      </div>
      <div class="card">
        <h2>Listado de Clientes</h2>
        <table class="table-box">
          <thead><tr><th>Cliente</th><th>Teléfono</th><th>Debe</th></tr></thead>
          <tbody id="clients-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- VISTA COMEX & CBM -->
    <div id="view-comex" class="view-container p-content hidden">
      <div class="card">
        <h2>Calculadora Express CBM (m³)</h2>
        <div style="display:flex;gap:6px;">
          <div class="field-row" style="flex:1;"><label>Largo cm</label><input id="c-l" type="number" placeholder="60"></div>
          <div class="field-row" style="flex:1;"><label>Ancho cm</label><input id="c-w" type="number" placeholder="40"></div>
          <div class="field-row" style="flex:1;"><label>Alto cm</label><input id="c-h" type="number" placeholder="40"></div>
          <div class="field-row" style="flex:1;"><label>Cant.</label><input id="c-q" type="number" placeholder="100"></div>
        </div>
        <button class="btn-action" onclick="calcCbm()">Calcular CBM</button>
        <div id="cbm-res" style="margin-top:8px;font-size:12px;font-weight:bold;color:#34d399;"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SB_URL = 'https://fedzgvgobjeokxfhvmok.supabase.co';
      var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlZHpndmdvYmplb2t4Zmh2bW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MzE4OTksImV4cCI6MjExMDEwNzg5OX0.tnxHWDOWQySJ8VDIQhYX5hmVHGvJCD7UlMrw7XeI2ZY';
      var state = { user: '', chatId: 'gen-1', channels: [], timer: null };

      function el(id) { return document.getElementById(id); }

      window.switchTab = function(tab) {
        el('view-chat').className = 'view-container chat-layout' + (tab === 'chat' ? '' : ' hidden');
        el('view-clients').className = 'view-container p-content' + (tab === 'clients' ? '' : ' hidden');
        el('view-comex').className = 'view-container p-content' + (tab === 'comex' ? '' : ' hidden');
        el('tab-chat').className = 'tab-btn' + (tab === 'chat' ? ' active' : '');
        el('tab-clients').className = 'tab-btn' + (tab === 'clients' ? ' active' : '');
        el('tab-comex').className = 'tab-btn' + (tab === 'comex' ? ' active' : '');
        if (tab === 'clients') loadClients();
      };

      function api(method, path, body, cb) {
        var x = new XMLHttpRequest();
        x.open(method, SB_URL + '/rest/v1/' + path, true);
        x.setRequestHeader('apikey', SB_KEY);
        x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
        x.setRequestHeader('Content-Type', 'application/json');
        if (method !== 'GET') x.setRequestHeader('Prefer', 'return=representation');
        x.onreadystatechange = function () {
          if (x.readyState === 4) {
            if (x.status >= 200 && x.status < 300) {
              var d = null; try { d = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) {}
              if (cb) cb(null, d);
            } else { if (cb) cb('HTTP ' + x.status, null); }
          }
        };
        x.send(body ? JSON.stringify(body) : null);
      }

      window.toggleSidebar = function(open) {
        var sb = el('sidebar');
        sb.className = 'sidebar' + (open ? ' open' : '');
        el('sb-backdrop').className = 'backdrop' + (open ? '' : ' hidden');
      };

      function loadChannels() {
        api('GET', 'channels?select=*', null, function(err, data) {
          if (!err && data) {
            state.channels = data;
            var box = el('ch-list'); box.innerHTML = '';
            for (var i = 0; i < data.length; i++) {
              (function(ch) {
                var d = document.createElement('div');
                d.className = 'ch-item' + (ch.id === state.chatId ? ' active' : '');
                d.textContent = '# ' + ch.name;
                d.onclick = function() { state.chatId = ch.id; el('active-ch-title').textContent = '# ' + ch.name; toggleSidebar(false); loadChannels(); loadMessages(); };
                box.appendChild(d);
              })(data[i]);
            }
          }
        });
      }

      function loadMessages() {
        api('GET', 'messages?select=*&channel_id=eq.' + encodeURIComponent(state.chatId) + '&order=created_at.asc', null, function(err, data) {
          if (!err && data) {
            var area = el('msg-area'); area.innerHTML = '';
            for (var i = 0; i < data.length; i++) {
              var m = data[i], me = m.sender && m.sender.toLowerCase() === state.user.toLowerCase();
              var row = document.createElement('div'); row.className = 'msg-row' + (me ? ' me' : '');
              var bb = document.createElement('div'); bb.className = 'msg-bubble';
              bb.textContent = (m.sender !== state.user ? '[' + m.sender + '] ' : '') + (m.text || '');
              row.appendChild(bb); area.appendChild(row);
            }
            area.scrollTop = area.scrollHeight;
          }
        });
      }

      window.sendMsg = function() {
        var inp = el('msg-input'), txt = inp.value.replace(/^\s+|\s+$/g, '');
        if (!txt) return;
        inp.value = '';
        var msg = { id: 'msg-' + new Date().getTime(), channel_id: state.chatId, sender: state.user, text: txt, time: '12:00', type: 'text' };
        api('POST', 'messages', [msg], function() { loadMessages(); });
      };

      window.sendPoke = function() {
        var msg = { id: 'msg-' + new Date().getTime(), channel_id: state.chatId, sender: state.user, text: '⚡ ¡Zumbido!', time: '12:00', type: 'poke' };
        api('POST', 'messages', [msg], function() { loadMessages(); });
      };

      window.createClient = function() {
        var name = el('cli-name').value, phone = el('cli-phone').value, debt = parseFloat(el('cli-debt').value) || 0;
        if (!name) return;
        var c = { id: 'cli-' + Date.now(), name: name, phone: phone, total_debt: debt, shipment_status: 'En Aduana' };
        api('POST', 'clients', [c], function(err) {
          if (!err) { el('cli-name').value = ''; el('cli-phone').value = ''; el('cli-debt').value = ''; loadClients(); }
        });
      };

      function loadClients() {
        api('GET', 'clients?select=*&order=created_at.desc', null, function(err, data) {
          if (!err && data) {
            var tb = el('clients-table-body'); tb.innerHTML = '';
            for (var i = 0; i < data.length; i++) {
              var c = data[i], tr = document.createElement('tr');
              tr.innerHTML = '<td><b>' + c.name + '</b></td><td>' + (c.phone || '-') + '</td><td>$' + (c.total_debt || 0) + '</td>';
              tb.appendChild(tr);
            }
          }
        });
      }

      window.calcCbm = function() {
        var l = parseFloat(el('c-l').value) || 0, w = parseFloat(el('c-w').value) || 0, h = parseFloat(el('c-h').value) || 0, q = parseFloat(el('c-q').value) || 0;
        if (l && w && h && q) {
          var res = ((l * w * h * q) / 1000000).toFixed(3);
          el('c-cbm-res').textContent = 'Total: ' + res + ' m³';
        }
      };

      el('login-form').onsubmit = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        var v = el('login-input').value.replace(/^\s+|\s+$/g, '');
        if (v) {
          state.user = v;
          el('login-view').className = 'login-screen hidden';
          el('app-view').className = 'app-wrap';
          loadChannels(); loadMessages();
          if (state.timer) clearInterval(state.timer);
          state.timer = setInterval(function() { loadMessages(); loadChannels(); }, 3000);
        }
        return false;
      };
    })();
  </script>
</body>
</html>
