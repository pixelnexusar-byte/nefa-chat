<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NEFA Software">
  <title>NEFA Software · iPad</title>
  <link rel="apple-touch-icon" href="/ipad/icon.png">
  <link rel="icon" type="image/png" href="/ipad/icon.png">
  <link rel="stylesheet" href="/ipad/app.css">
</head>
<body>
  <!-- BANNER DE ERROR VISIBLE -->
  <div id="error-banner" class="error-banner hidden"></div>

  <!-- LOGIN -->
  <section id="login" class="login-screen">
    <div class="login-card">
      <div class="logo-icon">N</div>
      <h1>NEFA Software</h1>
      <p class="subtitle">Ingresa tu nombre para conectar con el equipo en vivo</p>
      <form id="login-form">
        <label>Tu Nombre:</label>
        <input id="username" type="text" placeholder="Ej. Franco, Ariel, Melany..." value="Franco Sierralta" required>
        <button type="submit" class="btn-primary">Ingresar al Chat →</button>
      </form>
    </div>
  </section>

  <!-- APP PRINCIPAL -->
  <div id="app" class="app hidden">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="workspace-info">
          <div class="workspace-icon">N</div>
          <div class="workspace-text">
            <h2>NEFA Software</h2>
            <p>Canales en Vivo</p>
          </div>
        </div>
        <button id="close-sidebar-btn" class="btn-mobile-close" type="button">✕</button>
      </div>

      <div class="channels-bar">
        <span>CANALES</span>
        <button id="new-channel-btn" class="btn-new-ch" type="button">+ Nuevo</button>
      </div>

      <div class="sidebar-list" id="sidebar-list"></div>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar-small" id="user-initials">FS</div>
          <div class="user-meta">
            <p id="user-display-name">Franco</p>
            <p class="status-online">● En línea</p>
          </div>
        </div>
        <button id="logout-btn" class="btn-logout" type="button">Cambiar</button>
      </div>
    </aside>

    <!-- ÁREA DE CHAT -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="header-left">
          <button id="menu-btn" class="btn-menu" type="button">☰</button>
          <div class="chat-title">
            <h2 id="chat-name"># general</h2>
            <p id="chat-desc">Coordinación general del equipo</p>
          </div>
        </div>
        <div class="call-actions">
          <button id="voice-call-btn" class="btn-call" type="button" title="Llamada de voz">📞</button>
          <button id="video-call-btn" class="btn-call" type="button" title="Videollamada">📹</button>
        </div>
      </header>

      <div class="messages-container" id="messages-container"></div>

      <div class="chat-input-area">
        <button id="poke-btn" class="btn-poke" type="button" title="Enviar Zumbido MSN">🔔</button>
        <input id="chat-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="send-btn" class="btn-send" type="button">Enviar</button>
      </div>
    </main>
  </div>

  <!-- MODAL DE LLAMADA / VIDEOLLAMADA -->
  <div id="call-modal" class="call-modal hidden">
    <div class="call-modal-header">
      <span id="call-modal-title">● Sala en vivo</span>
      <div>
        <a id="call-external-link" href="#" target="_blank" class="btn-ext-call">Abrir en pestaña</a>
        <button id="close-call-btn" class="btn-hangup" type="button">Salir de la Sala</button>
      </div>
    </div>
    <div id="call-iframe-wrap" class="call-iframe-wrap"></div>
  </div>

  <script src="/ipad/app.js"></script>
</body>
</html>
